# Custom Keymaps
# -----------------------------------------------------------------------------

# Update the prefix from C-b to C-a
set -g prefix C-a
unbind C-b           # unbind default prefix
bind C-a send-prefix # pass prefix through by pressing it twice

# synchronize-panes toggle
# bind C-s setw synchronize-panes

# toggle pane between zoomed/fullscreen and unzoomed states
bind -r C-f resize-pane -Z

# Alternate mapping to clear-screen
bind C-l send-keys 'C-l'

# Enter copy mode
bind-key u copy-mode
bind-key v copy-mode \; send -X begin-selection

# Get copy & paste to work in vim mode
setw -g mode-keys vi
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle

# Switch sessions
bind -n S-M-PPage switch-client -p
bind -n S-M-NPage switch-client -n
bind -n S-M-Up switch-client -p
bind -n S-M-Down switch-client -n

# Switch windows
bind -r < select-window -t -1
bind -r > select-window -t +1

# Switch sessions
bind -r C-n switch-client -n # next session
bind -r C-p switch-client -l # last session

bind -n S-M-Left run-shell '~/.dotfiles/scripts/tmux-switch-session previous "#{client_name}"' # previous session
bind -n S-M-Right run-shell '~/.dotfiles/scripts/tmux-switch-session next "#{client_name}"' # next session
bind -n S-M-u run-shell '~/.dotfiles/scripts/tmux-switch-session previous "#{client_name}"' # previous session
bind -n S-M-i run-shell '~/.dotfiles/scripts/tmux-switch-session next "#{client_name}"' # next session
bind -n S-M-p switch-client -l # last session

# Ghostty workaround
# Alt+Shift+, -> sends M-¯
# Alt+Shift+. -> sends M-˘
if-shell '[[ "$TERM_PROGRAM" == "ghostty" ]]' {
  bind -n ¯ select-window -t -1
  bind -n ˘ select-window -t +1
}

bind -r C-u select-window -t -1
# bind -r C-i select-window -t +1
bind -r M-i select-window -t +1
# M-i is remapped to A-i to avoid Tmux treating it as TAB
# refer to terminal multiplexer settings for details

# Swap windows
bind -r S-C-u swap-window -t -1 \; select-window -t -1
bind -r S-C-i swap-window -t +1 \; select-window -t +1

# Other window manipulations
bind -n M-, rotate-window -D # -U for counter-clockwise
bind -n M-. choose-tree -Z
bind -n M-/ next-layout
bind -n C-M-_ previous-layout

# Bind more intuitive window spliting shortcuts
bind -r h split-window -hb -c "#{pane_current_path}"
bind -r j split-window -v -c "#{pane_current_path}"
bind -r k split-window -vb -c "#{pane_current_path}"
bind -r l split-window -h -c "#{pane_current_path}"

# Vim tmux keybinds
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Enable navigating to last pane from vim
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'last-pane'
bind-key -T copy-mode-vi 'C-\' select-pane -R

# Modify tmux keybindings to route Ctrl-* to lazygit
is_editor="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|lazygit|n?vim?x?)(diff)?$'"
bind -n 'C-h' if-shell "$is_editor" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_editor" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_editor" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_editor" 'send-keys C-l' 'select-pane -R'

# Reload tmux config (leader r)
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Toggle the session manager in a centered floating pane (leader s). Close a
# persistent popup first when invoked from the scratch or assistant session.
bind s if-shell -F "#{==:#{pane_start_command},tmux-session-manager --no-popup}" \
  "kill-pane" \
  "if-shell \"echo '#{session_name}' | grep -Eq '^(scratch-terminal|assistant-terminal)$'\" \
    \"detach-client; run tmux-session-manager\" \
    \"new-pane -c '#{pane_current_path}' -x 60% -y 40% -X 20% -Y 30% -S 'fg=#33ccff' -R 'fg=#33ccff' tmux-session-manager --no-popup\""

# Toggle lazygit in a floating pane (leader g). Unlike a modal popup, a
# floating pane lets tmux handle the prefix key while lazygit is running.
bind g if-shell -F "#{==:#{pane_start_command},lazygit}" \
  "kill-pane" \
  "new-pane -c '#{pane_current_path}' -x 90% -y 90% -X 5% -Y 5% -S 'fg=#33ccff' -R 'fg=#33ccff' lazygit"

# Toggle gh dash in a centered floating pane (leader G)
bind G if-shell -F "#{==:#{pane_start_command},gh dash}" \
  "kill-pane" \
  "new-pane -c '#{pane_current_path}' -x 90% -y 90% -X 5% -Y 5% -S 'fg=#33ccff' -R 'fg=#33ccff' gh dash"

# Toggle lazydocker in a centered floating pane (leader d)
bind d if-shell -F "#{==:#{pane_start_command},lazydocker}" \
  "kill-pane" \
  "new-pane -c '#{pane_current_path}' -x 90% -y 90% -X 5% -Y 5% -S 'fg=#33ccff' -R 'fg=#33ccff' lazydocker"

# Toggle yazi in a centered floating pane (leader f)
bind f if-shell -F "#{==:#{pane_start_command},yazi}" \
  "kill-pane" \
  "new-pane -c '#{pane_current_path}' -x 90% -y 90% -X 5% -Y 5% -S 'fg=#33ccff' -R 'fg=#33ccff' yazi"

# Toggle floating assistant terminal (leader a)
bind a run-shell "~/.dotfiles/scripts/tmux-assistant-terminal toggle"

# Toggle floating scratch terminal (leader Space)
bind Space run-shell "~/.dotfiles/scripts/tmux-scratch-terminal toggle"
bind t run-shell "~/.dotfiles/scripts/tmux-scratch-terminal toggle"
bind e if-shell -F "#{==:#{session_name},assistant-terminal}" \
  "run-shell ~/.dotfiles/scripts/tmux-assistant-terminal\ embed" \
  "run-shell ~/.dotfiles/scripts/tmux-scratch-terminal\ embed"

# Rebind switching layout to prefix+/
bind / next-layout

# Rebind detach to prefix+D
bind D detach-client
