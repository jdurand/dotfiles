# Voxtype Configuration

state_file = "auto"

[hotkey]
key = "SCROLLLOCK"
modifiers = []

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "base.en"
language = "en"
translate = false

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 0

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = true

[osd]
frontend = "quickshell"
style = "default"
layout = "wide"

[osd.frame]
background = "background"
border = "state"
glow = true
halo = true
